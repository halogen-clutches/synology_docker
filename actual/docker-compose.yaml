services:
  actual_server:
    image: docker.io/actualbudget/actual-server:latest
    ports:
      - ${HOST_PORT}:5006
    volumes:
      - /volume1/docker/actual:/data
    healthcheck:
      test: ['CMD-SHELL', 'node src/scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.name=Actual
      - flame.url=${FLAME_URL}
      - flame.icon=duck
