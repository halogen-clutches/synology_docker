services:
  yt-dlp-webui:
    image: marcobaobao/yt-dlp-webui
    ports:
      - 9588:3033
    env_file:
      - ../location.env
    environment:
      - TZ=${TZ}
    volumes:
      - /volume1/docker/yt-dlp-webui:/downloads 
    healthcheck:
      test: curl -f http://localhost:3033 || exit 1
    restart: unless-stopped
