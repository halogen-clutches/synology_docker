version: "2.1"
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - TZ=America/New_York
      - GUID=[[GUID]]
      - PUID=[[PUID]]
    volumes:
      - /volume1/docker/sonarr/config:/config
      - /volume1/data:/data
    ports:
      - 8989:8989
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.name=Sonarr
      - flame.url=https://sonarr.thechangcuellos.com
      - flame.icon=koala

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - TZ=America/New_York
      - GUID=[[GUID]]
      - PUID=[[PUID]]
    volumes:
      - /volume1/docker/radarr/config:/config
      - /volume1/data:/data
    ports:
      - 7878:7878
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.name=Radarr
      - flame.url=https://radarr.thechangcuellos.com
      - flame.icon=sheep
   
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - TZ=America/New_York
      - GUID=[[GUID]]
      - PUID=[[PUID]]
    volumes:
      - /volume1/docker/bazarr/config:/config
      - /volume1/data:/data
    ports:
      - 6767:6767
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.name=Bazarr
      - flame.url=https://bazarr.thechangcuellos.com
      - flame.icon=owl
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - TZ=America/New_York
      - PGID=[[PGID]]
      - PUID=[[PUID]]
    volumes:
      - /volume1/docker/sabnzbd/config:/config
      - /volume1/data/usenet_downloads/incomplete:/incomplete_downloads # optional
      - /volume1/data/usenet_downloads:/usenet_downloads #optional
    ports:
      - 8777:8080
      - 9090:9090
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.name=Sabnzbd
      - flame.url=[[flame-url]]
      - flame.icon=tortoise